apiVersion: v1
kind: Pod
metadata:
  generateName: nvidia-native-check-
  namespace: default
spec:
  nodeName: talos-4rh-gm0
  restartPolicy: Never
  activeDeadlineSeconds: 300
  runtimeClassName: nvidia
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: check
      image: 192.168.1.139:5000/arc-cuda-runner:cuda-13.2-nccl
      command: [sleep, '300']
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        limits:
          nvidia.com/gpu: 2
